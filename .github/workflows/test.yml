name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]' build
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify installed assets outside source directory
        run: |
          python -m venv /tmp/relay-wheel
          /tmp/relay-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/relay-wheel/bin/python -c "from brain_relay.app import create_app; import tempfile; app=create_app({'DATA_DIR':tempfile.mkdtemp()}); c=app.test_client(); assert c.get('/').status_code==200; assert c.get('/styleguide').status_code==200; assert c.get('/api/example').status_code==200"
